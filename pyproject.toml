[project]
name = "stockapp"
version = "0.1.0"
description = "Personal weekly decision-support app for Nifty 500 stocks (not investment advice)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.27",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.8",
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.16",
]

[project.scripts]
stockapp = "stockapp.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: hits a real external service; skipped unless the needed env vars are set",
]
