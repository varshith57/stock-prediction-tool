name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # run by hand (Actions tab or `gh workflow run CI`) to test the Telegram secrets

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockapp
          POSTGRES_PASSWORD: stockapp   # throwaway CI database
          POSTGRES_DB: stockapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: ci
      REQUIRE_DB: "1"   # database tests must run in CI, never skip
      TEST_DATABASE_URL: postgresql://stockapp:stockapp@localhost:5432/stockapp
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not live"

  telegram-smoke:
    # Proves the GitHub Telegram secrets work. Manual runs only, so pushes don't message your phone.
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - name: Send test alert
        env:
          APP_ENV: ci
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ]; then echo "Telegram secrets not set; skipping"; exit 0; fi
          uv run stockapp telegram-test
